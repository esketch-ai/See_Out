name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # 브라우저 전수 감사용. puppeteer/playwright 는 이 단계 전까지 쓰이지 않는다.
      - name: Install browser for UI audit
        run: npx playwright install --with-deps chromium

      - name: Run verification test suite
        run: npm test

      - name: Build web application
        env:
          BASE_PATH: /See_Out/
        run: npm run build:web

      # 단위 테스트 213건이 전부 통과한 상태로 아래 결함이 실제 배포돼 있었다.
      #   - ProfessionalCareModal 이 isOpen 분기 아래 훅을 호출 → 클릭하면
      #     React #310 으로 화면 전체가 백화면이 된다
      #   - text-xs(12px) 462건 — N-7 「13px 금지」 위반
      #   - text-red-300 등 이름 팔레트 44종 191건 — 정본 밖
      # 전부 컴포넌트를 렌더하지 않는 단위 테스트가 통과하는 종류다.
      # 실제 브라우저로 팝업 25종과 탭 5개를 열어 판정한다.
      - name: Audit rendered UI
        run: node scripts/audit-ui.mjs

      - name: Prepare GitHub Pages files (.nojekyll & 404.html)
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
