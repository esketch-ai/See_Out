<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="배웅">
  <!-- 닫히는 선 대신, 사라질 때까지 가늘어지는 선.
       「그대 사라질 때까지 보네」 — 끝이 보이지 않는 것이 마주임이다. -->
  <defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8B2520" stop-opacity="1"/>
    <stop offset="70%" stop-color="#8B2520" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#243F35" stop-opacity="0"/>
  </linearGradient></defs>
  <path d="M40 148 C64 96 104 62 164 46" fill="none" stroke="url(#g4)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="40" cy="148" r="10" fill="#8B2520"/>
</svg>
