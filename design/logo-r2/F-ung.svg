<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="배웅 시안 F 웅">
  <title>F — 웅(雄) : 원·지렁대·원</title>
  <!-- 배웅의 두 번째 자. 위에서 아래로 쌓인 세 요소가
       「기다림 → 받침 → 지키는 원」 이라 읽힌다. -->
  <g fill="none" stroke="#243F35" stroke-width="19" stroke-linecap="round">
    <circle cx="100" cy="52" r="30"/>
    <path d="M58 108 h84"/>
    <circle cx="100" cy="152" r="30"/>
  </g>
  <!-- 받침 아래 금박 한 점: 약속의 무게 -->
  <circle cx="100" cy="108" r="9" fill="#C2A26A"/>
</svg>
