<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="배웅 창호살격 시안">
  <title>시안 B — 창호살격(窓戶殺格) : 투명 배경 변형 (정사각 블록이 필요 없는 자리)</title>
  <!-- 기둥 3 「창호살격」: 전통 창호의 살창이 곧 이 서비스의 신뢰 그물이다.
       index.html k-changho-texture 의 실측 규격(24px 격자 · 정방형 45° 마름모
       + 중심점)을 그대로 손의 크기로 키운다. -->
  <defs>
    <g id="b-cell">
      <path d="M0 -9 L9 0 L0 9 L-9 0 Z" fill="none" stroke="#C2A26A" stroke-width="1.3" stroke-opacity="0.72"/>
      <circle cx="0" cy="0" r="1.6" fill="#C2A26A" fill-opacity="0.6"/>
    </g>
    <pattern id="b-lattice" width="18" height="18" patternUnits="userSpaceOnUse">
      <use href="#b-cell" x="9" y="9"/>
    </pattern>
    <radialGradient id="b-hush" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#0A1511" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0A1511" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <!-- 2. 살창 그물 -->
  <rect x="22" y="22" width="196" height="196" fill="url(#b-lattice)"/>
  <rect x="22" y="22" width="196" height="196" fill="#0A1511" fill-opacity="0.35"/>

  <!-- 3. 창호 테두리 — 황동 귀접이(기둥 3)를 네 귀퉁이에 -->
  <g stroke="#C2A26A" stroke-width="2.4" fill="none" stroke-linecap="square">
    <path d="M22 52 v-30 h30"/>
    <path d="M218 22 h-30 v30"/>
    <path d="M22 188 v30 h30"/>
    <path d="M218 218 h-30 v-30"/>
  </g>

  <!-- 4. 그물 한가운데를 잠잠히 가린다. 살창을 보되 「잠잠한 한가운데」 가 있어야
       아까운 품이 아니라 안락함을 준다. (기둥 2 한지여백을 그물 안으로 확장) -->
  <circle cx="120" cy="120" r="62" fill="url(#b-hush)"/>

  <!-- 5. 정산 인장 — 전각낙관(기둥 4). 「眞」 : 거짓 없는 100% 원가 공개.
       유족이 제일 많이 열第二个 곳의 이름이므로 여기 놓는다. -->
  <g transform="translate(120 120)">
    <rect x="-38" y="-38" width="76" height="76" rx="4" fill="#0D0E10" fill-opacity="0.72"
          stroke="#D4665A" stroke-width="4"/>
    <text x="0" y="17" text-anchor="middle" font-family="Noto Serif KR, Nanum Myeongjo, serif"
          font-size="52" font-weight="700" fill="#F7F5F0">眞</text>
  </g>
</svg>
