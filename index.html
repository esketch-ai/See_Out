<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배웅 (Bae-ung) — 삼가 고인의 명복을 빌며, 정직한 예우로 모십니다</title>
    
    <!-- 구글 Noto Serif KR (경건한 명조체) & Pretendard -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Noto Serif KR"', 'serif'],
              sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            colors: {
              hanji: '#FAF8F5',
              porcelain: '#FFFFFF',
              ink: {
                DEFAULT: '#1F2226',
                light: '#4B5259',
                muted: '#6C757D',
                border: '#E3DFD7'
              },
              celadon: {
                50: '#F2F6F4',
                100: '#E2ECE8',
                200: '#C7D9D1',
                600: '#2D4F43',
                700: '#243F35',
                800: '#1C312A',
                900: '#13221D'
              },
              nobleGold: {
                50: '#FBF9F5',
                100: '#F6F1E6',
                500: '#94784C',
                600: '#7F673E',
                700: '#695532'
              },
              mourning: {
                800: '#212529',
                900: '#16191D',
                950: '#0E1012'
              },
              crimson: {
                50: '#FDF2F2',
                600: '#A33B32',
                700: '#8A2F27'
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        background-color: #FAF8F5;
        color: #1F2226;
        -webkit-font-smoothing: antialiased;
        word-break: keep-all;
      }
      .font-reverence {
        font-family: "Noto Serif KR", Georgia, serif;
      }
      .btn-senior-reverence {
        min-height: 64px;
        font-size: 1.25rem; /* 20px */
        font-weight: 700;
        border-radius: 16px;
        letter-spacing: -0.01em;
      }
      /* 노안 어르신 전용 큰 글씨 모드 (전역 rem 스케일링) */
      html.senior-large-font {
        font-size: 122% !important;
      }
      html.senior-large-font body {
        line-height: 1.75;
      }
      html.senior-large-font .font-reverence {
        letter-spacing: -0.015em;
      }

      /* ═══════════ 조성우 수석 디자이너 감수: 전통 한국적 미학 조형 스타일 ═══════════ */
      /* 1. 전통 전각 낙관 (인장 도장) */
      .k-seal-red {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #A33B32;
        color: #FAF8F5;
        font-family: "Noto Serif KR", Georgia, serif;
        font-weight: 900;
        border: 1.5px solid #8A2F27;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3), 0 2px 4px rgba(163, 59, 50, 0.25);
        border-radius: 6px;
        letter-spacing: -0.02em;
        user-select: none;
      }
      .k-seal-gold {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #94784C;
        color: #FAF8F5;
        font-family: "Noto Serif KR", Georgia, serif;
        font-weight: 900;
        border: 1.5px solid #7F673E;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35), 0 2px 4px rgba(148, 120, 76, 0.25);
        border-radius: 6px;
        letter-spacing: -0.02em;
        user-select: none;
      }
      .k-seal-jade {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #2D4F43;
        color: #FAF8F5;
        font-family: "Noto Serif KR", Georgia, serif;
        font-weight: 900;
        border: 1.5px solid #1C312A;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3), 0 2px 4px rgba(45, 79, 67, 0.25);
        border-radius: 6px;
        letter-spacing: -0.02em;
        user-select: none;
      }

      /* 2. 전통 창호지 미세 살창 격자 텍스처 */
      .k-changho-texture {
        background-image: radial-gradient(#E3DFD7 0.85px, transparent 0.85px);
        background-size: 18px 18px;
      }

      /* 3. 전통 단아한 금빛 절제선 */
      .k-traditional-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, #C5A880, transparent);
      }

      /* 4. 전통 고서/의궤 귀접이 프레임 (모서리 악센트) */
      .k-corner-bracket {
        position: relative;
      }
      .k-corner-bracket::before {
        content: "";
        position: absolute;
        top: 8px;
        left: 8px;
        width: 14px;
        height: 14px;
        border-top: 2px solid #C5A880;
        border-left: 2px solid #C5A880;
        pointer-events: none;
      }
      .k-corner-bracket::after {
        content: "";
        position: absolute;
        bottom: 8px;
        right: 8px;
        width: 14px;
        height: 14px;
        border-bottom: 2px solid #C5A880;
        border-right: 2px solid #C5A880;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="bg-hanji text-ink selection:bg-celadon-100 selection:text-celadon-900">
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
