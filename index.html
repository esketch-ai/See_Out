<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배웅 (Bae-ung) — 삼가 고인의 명복을 빌며, 정직한 예우로 모십니다</title>
    
    <!-- 구글 Noto Serif KR (경건한 명조체) & Pretendard -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Noto Serif KR"', 'serif'],
              sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            colors: {
              hanji: {
                DEFAULT: '#F7F5F0',
                surface: '#FAF9F6',
                border: '#E3DFD5',
                borderLight: '#ECE8E0',
              },
              porcelain: '#FFFFFF',
              ink: {
                DEFAULT: '#151719',
                deep: '#0E1012',
                light: '#42464E',
                muted: '#727782',
                border: '#E3DFD5',
                borderLight: '#ECE8E0'
              },
              pine: {
                50: '#F0F5F2',
                100: '#DCE8E2',
                200: '#BFD4CA',
                600: '#234C3C',
                700: '#19382C',
                800: '#132B22',
                900: '#0E1E18'
              },
              brass: {
                50: '#F8F5EE',
                100: '#F1E9DB',
                200: '#E4D5BC',
                500: '#9E7D47',
                600: '#876937',
                700: '#6E5429',
                800: '#55411E'
              },
              cinnabar: {
                50: '#FAF0EF',
                100: '#F4DCDA',
                600: '#8B2520',
                700: '#731C18',
                800: '#5B1512'
              },
              /* 하위 호환성 유지 */
              celadon: {
                50: '#F0F5F2',
                100: '#DCE8E2',
                600: '#234C3C',
                700: '#19382C',
                800: '#132B22',
                900: '#0E1E18'
              },
              nobleGold: {
                50: '#F8F5EE',
                100: '#F1E9DB',
                500: '#9E7D47',
                600: '#876937',
                700: '#6E5429'
              },
              mourning: {
                800: '#1F2226',
                900: '#141618',
                950: '#0D0E10'
              },
              crimson: {
                600: '#8B2520',
                700: '#731C18'
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        background-color: #F7F5F0;
        color: #151719;
        -webkit-font-smoothing: antialiased;
        word-break: keep-all;
      }
      .font-reverence {
        font-family: "Noto Serif KR", Georgia, serif;
      }
      .btn-senior-reverence {
        min-height: 60px;
        font-size: 1.15rem;
        font-weight: 700;
        border-radius: 8px;
        letter-spacing: -0.01em;
      }
      /* 노안 어르신 전용 큰 글씨 모드 */
      html.senior-large-font {
        font-size: 122% !important;
      }
      html.senior-large-font body {
        line-height: 1.8;
      }
      html.senior-large-font .font-reverence {
        letter-spacing: -0.015em;
      }

      /* ═══════════ 전통 한국 문화 격식 조형 스타일 (Heritage Elegance) ═══════════ */
      /* 1. 전통 전각 낙관 (인장 도장) */
      .k-seal-red {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #8B2520;
        color: #FAF9F6;
        font-family: "Noto Serif KR", Georgia, serif;
        font-weight: 900;
        border: 1px solid #701C18;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        letter-spacing: -0.02em;
        user-select: none;
      }
      .k-seal-gold {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #9E7D47;
        color: #FAF9F6;
        font-family: "Noto Serif KR", Georgia, serif;
        font-weight: 900;
        border: 1px solid #826534;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        letter-spacing: -0.02em;
        user-select: none;
      }
      .k-seal-jade {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #19382C;
        color: #FAF9F6;
        font-family: "Noto Serif KR", Georgia, serif;
        font-weight: 900;
        border: 1px solid #11261E;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        letter-spacing: -0.02em;
        user-select: none;
      }

      /* 2. 전통 박물관 도록 스타일의 단정한 카드 */
      .k-card-heritage {
        background-color: #FFFFFF;
        border: 1px solid #E3DFD5;
        border-radius: 10px;
        box-shadow: 0 1px 3px rgba(21, 23, 25, 0.04);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .k-card-heritage:hover {
        border-color: #9E7D47;
        box-shadow: 0 6px 16px rgba(21, 23, 25, 0.08);
      }

      /* 3. 3폭 병풍(屛風) 분할선 */
      .k-screen-panel {
        background-color: #FFFFFF;
        border: 1px solid #E3DFD5;
        border-radius: 8px;
        position: relative;
      }

      /* 4. 전통 황동 단아한 구분선 */
      .k-traditional-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, #D4B37F, transparent);
      }
    </style>
  </head>
  <body class="bg-hanji text-ink selection:bg-pine-100 selection:text-pine-900">
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
