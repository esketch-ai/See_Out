<!DOCTYPE html>
<html lang="ko">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- 구글 Noto Serif KR (경건한 명조체) & Pretendard -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {

          extend: {

              porcelain: '#FFFFFF',

                100: '#E2ECE8',

                600: '#2D4F43',
                700: '#243F35',

            }
          }
        }
      }

        -webkit-font-smoothing: antialiased;
        word-break: keep-all;
      }
      .font-reverence {

      }
      .btn-senior-reverence {
        min-height: 64px;
        font-size: 1.25rem; /* 20px */
        font-weight: 700;
        border-radius: 16px;
        letter-spacing: -0.01em;
      }

  </head>
  <body class="bg-hanji text-ink selection:bg-celadon-100 selection:text-celadon-900">
